schema_version = 1
profile = "standard"

[lifecycle]
command = ["fledge", "lanes", "run", "verify"]

[contract]
enabled = true
require_coverage = 0
skip_reason = "SpecSync does not measure the extensionless Bash executable; syntax, ShellCheck, smoke tests, and manifest validation are blocking"

[risk]
threshold = "block"

[provenance]
mode = "soft"
policy = ".attest.json"
skip_reason = ""

[atlas]
enabled = false
skip_reason = "No Trust-managed Atlas publication is configured"
